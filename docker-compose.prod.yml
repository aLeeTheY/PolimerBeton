# docker-compose project name
name: polimerbeton--prod

services:
    app:
        build:
            context: .
            dockerfile: src/Dockerfile.prod
        image: polimerbeton-app:prod
        container_name: polimerbeton-app--prod
        command: gunicorn config.wsgi:application --bind 0.0.0.0:8080 --workers 3
        restart: always
        volumes:
            - static_volume:/home/warden/www/polimerbeton/backend/staticfiles
        expose:
            - 8080
        env_file:
            - ./env/.env.prod
        depends_on:
            db:
                condition: service_healthy

    db:
        image: postgres:18-alpine
        container_name: polimerbeton-db--prod
        restart: always
        env_file:
            - ./env/.env.prod.db
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 10

    nginx-proxy:
        build:
            context: ./deploy/nginx-proxy
            dockerfile: Dockerfile
        container_name: nginx-proxy--prod
        restart: always
        ports:
            - 443:443
            - 80:80
        volumes:
            - static_volume:/home/warden/www/polimerbeton/backend/staticfiles
            - conf:/etc/nginx/conf.d
            - vhost:/etc/nginx/vhost.d
            - html:/usr/share/nginx/html
            - certs:/etc/nginx/certs:ro
            - /var/run/docker.sock:/tmp/docker.sock:ro
        depends_on:
            - app

    docker-gen:
        image: nginxproxy/docker-gen:0.17
        container_name: docker-gen--prod
        restart: always
        command: -notify-sighup nginx -watch -only-exposed /etc/docker-gen/templates/nginx.tmpl /etc/nginx/conf.d/default.conf
        volumes:
            - ./deploy/templates/docker-gen/nginx.tmpl:/etc/docker-gen/templates/nginx.tmpl:ro
            - conf:/etc/nginx/conf.d
            - vhost:/etc/nginx/vhost.d
            - html:/usr/share/nginx/html
            - certs:/etc/nginx/certs:ro
            - /var/run/docker.sock:/tmp/docker.sock:ro

    acme-companion:
        image: nginxproxy/acme-companion:2.8
        container_name: acme-companion--prod
        restart: always
        env_file:
            - ./env/.env.prod.proxy-companion
        volumes:
            - conf:/etc/nginx/conf.d
            - vhost:/etc/nginx/vhost.d
            - html:/usr/share/nginx/html
            - certs:/etc/nginx/certs:rw
            - acme:/etc/acme.sh
            - /var/run/docker.sock:/var/run/docker.sock:ro
        depends_on:
            - nginx-proxy

networks:
    default:
        name: polimerbeton-app-network-prod

volumes:
    postgres_data:
    static_volume:
    acme:
    certs:
    html:
    vhost:
    conf:
